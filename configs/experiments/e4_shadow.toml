# E4 (C2): shadow removal off/on on original DEV images; see error_types in summary.csv.
[experiment]
name = "e4_shadow"
base = "configs/baseline.toml"
split = "dev"

[variants.off]
shadow = false
[variants.on]
shadow = true
[variants.on_hi085]   # only the upper ratio bound changed (report §3.4)
shadow = true
shadow_hi = 0.85
[variants.on_strict]
shadow = true
shadow_hi = 0.85
shadow_t_grad = 15.0
